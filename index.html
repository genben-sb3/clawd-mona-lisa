<input type="range" id="seek" min="0" max="191" step="1" value="0" aria-label="Frame">
<div class="row">
<button id="play" type="button">Pause</button>
<button id="prev" type="button" aria-label="Ein Frame zurück">−1</button>
<button id="next" type="button" aria-label="Ein Frame vor">+1</button>
<span id="time">Frame 0 von 191</span>
</div>
<div class="row" role="group" aria-label="Tempo">
<button class="sp" data-r="1" type="button" aria-pressed="true">Normal</button>
<button class="sp" data-r="0.5" type="button" aria-pressed="false">Halb</button>
<button class="sp" data-r="0.25" type="button" aria-pressed="false">Viertel</button>
<button id="zoom" type="button" aria-pressed="true">Nah</button>
</div>
</main>
<script>
const v=document.getElementById('v'),seek=document.getElementById('seek'),time=document.getElementById('time'),play=document.getElementById('play');
const frame=()=>Math.min(191,Math.floor(v.currentTime*24+0.001));
const show=()=>{const f=frame();seek.value=f;time.textContent='Frame '+f+' von 191';play.textContent=v.paused?'Abspielen':'Pause';};
const go=(f)=>{v.pause();v.currentTime=(Math.max(0,Math.min(191,f))+0.5)/24;show();};
const tick=()=>{if(!v.paused)show();requestAnimationFrame(tick);};tick();
v.addEventListener('timeupdate',show);v.addEventListener('seeked',show);v.addEventListener('pause',show);v.addEventListener('play',show);
seek.addEventListener('input',()=>go(+seek.value));
const toggle=()=>{if(v.paused)v.play().catch(()=>{});else v.pause();};
play.addEventListener('click',toggle);v.addEventListener('click',toggle);
document.getElementById('prev').addEventListener('click',()=>go(frame()-1));
document.getElementById('next').addEventListener('click',()=>go(frame()+1));
document.querySelectorAll('.sp').forEach(b=>b.addEventListener('click',()=>{v.playbackRate=+b.dataset.r;document.querySelectorAll('.sp').forEach(o=>o.setAttribute('aria-pressed',o===b));}));
const z=document.getElementById('zoom');z.addEventListener('click',()=>{const on=document.getElementById('stage').classList.toggle('near');z.setAttribute('aria-pressed',on);});
</script></body></html>
